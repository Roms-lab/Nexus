<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - You are offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fallback for fonts since they are external -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Inlined CSS to ensure offline availability */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00BFFF; /* Electric Blue */
            --border-color: #444;
            --font-family: 'Roboto', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .offline-container {
            max-width: 600px;
            padding: 3rem 2rem;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        .offline-container h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        .offline-container p {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }

        .offline-container .icon {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        .offline-container .retry-button {
            display: inline-block;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            color: var(--bg-color);
            background-color: var(--accent-color);
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .offline-container .retry-button:hover {
            background-color: #0099e6;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .offline-container {
                padding: 2rem 1.5rem;
            }
            .offline-container h1 {
                font-size: 2rem;
            }
            .offline-container p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="offline-container">
        <div class="icon">🔌</div>
        <h1>You are offline</h1>
        <p>It seems your internet connection is down. Please check your network and try again.</p>
        <button class="retry-button" onclick="location.reload()">Retry Now</button>
    </div>

</body>
</html>
